name: UTUVOExplain
options:
  bundleIdPrefix: com.mickyyang
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  UTUVOExplain:
    type: application
    platform: macOS
    sources: [Sources, Resources/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mickyyang.MickyExplain
        PRODUCT_NAME: UTUVO Explain
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGNING_ALLOWED: YES
